packages:
  - block
  - kind
  - model
  - software
  - test
  - ui
  - workflow

catalog:
  # SDK packages - EXACT VERSIONS (no ^ or ~)
  "@milaboratories/ts-builder": 1.7.3
  "@milaboratories/ts-configs": 1.4.0
  "@platforma-sdk/workflow-tengo": 6.22.0
  "@platforma-sdk/model": 1.88.0
  "@platforma-sdk/ui-vue": 1.88.3
  "@platforma-sdk/tengo-builder": 4.1.19
  "@platforma-sdk/package-builder": 3.16.3
  "@platforma-sdk/block-tools": 2.17.7
  "@platforma-sdk/block-kind": 1.1.0
  "@platforma-sdk/test": 1.88.7
  "@milaboratories/helpers": 1.14.6
  "@milaboratories/strings": 0.1.2

  # Block-specific dependencies
  "@milaboratories/graph-maker": 1.10.7
  "@milaboratories/multi-sequence-alignment": "1.47.35"
  "@milaboratories/software-pframes-conv": ^2.2.9
  "@platforma-open/milaboratories.runenv-python-3": ^1.7.3
  "@platforma-open/soedinglab.software-mmseqs2": 1.19.0

  # Common dependencies - can use ^ or ~
  "vue": 3.5.44
  "typescript": ~5.6.3
  "turbo": ~2.11.10
  "vitest": ^4.1.3
  "eslint": ^9.25.1
  "@changesets/cli": ^2.29.8
  "shx": ^0.4.0
  "@types/node": ^24.5.2
  # pinned to the copy already in the graph, so the kind does not pull a second one
  "es-toolkit": 1.39.10
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  "@milaboratories/tengo-tester": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  "@milaboratories/pframes-rs-node": true
